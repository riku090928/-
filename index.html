<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>協賛メール送付リスト</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: "Hiragino Kaku Gothic ProN", "Noto Sans JP", sans-serif;
      background: #f0f4f8;
      color: #1a202c;
      font-size: 14px;
    }

    /* ── ヘッダー ── */
    header {
      background: linear-gradient(135deg, #1e3a5f 0%, #2d6a9f 100%);
      color: #fff;
      padding: 20px 28px;
      display: flex;
      align-items: center;
      gap: 14px;
      box-shadow: 0 2px 8px rgba(0,0,0,.25);
    }
    header .logo {
      width: 42px; height: 42px;
      background: #fff;
      border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      font-size: 20px;
    }
    header h1 { font-size: 20px; font-weight: 700; }
    header p  { font-size: 12px; opacity: .8; margin-top: 2px; }

    /* ── 統計カード ── */
    .stats {
      display: flex; flex-wrap: wrap; gap: 12px;
      padding: 20px 28px 0;
    }
    .stat-card {
      background: #fff;
      border-radius: 10px;
      padding: 14px 20px;
      min-width: 130px;
      box-shadow: 0 1px 4px rgba(0,0,0,.08);
      flex: 1;
    }
    .stat-card .num { font-size: 28px; font-weight: 700; }
    .stat-card .lbl { font-size: 11px; color: #718096; margin-top: 2px; }
    .stat-card.total  .num { color: #2d6a9f; }
    .stat-card.sent   .num { color: #38a169; }
    .stat-card.unsent .num { color: #dd6b20; }
    .stat-card.ng     .num { color: #e53e3e; }

    /* ── フィルター ── */
    .filters {
      display: flex; flex-wrap: wrap; gap: 10px;
      padding: 16px 28px;
      background: #fff;
      margin: 16px 28px;
      border-radius: 10px;
      box-shadow: 0 1px 4px rgba(0,0,0,.08);
    }
    .filters input,
    .filters select {
      border: 1px solid #cbd5e0;
      border-radius: 6px;
      padding: 7px 12px;
      font-size: 13px;
      outline: none;
      transition: border-color .2s;
      font-family: inherit;
    }
    .filters input:focus,
    .filters select:focus { border-color: #2d6a9f; }
    .filters input { min-width: 200px; flex: 1; }

    .btn {
      padding: 7px 16px;
      border-radius: 6px;
      border: none;
      cursor: pointer;
      font-size: 13px;
      font-family: inherit;
      font-weight: 600;
      transition: background .2s;
    }
    .btn-primary { background: #2d6a9f; color: #fff; }
    .btn-primary:hover { background: #1e3a5f; }
    .btn-success { background: #38a169; color: #fff; }
    .btn-success:hover { background: #276749; }
    .btn-outline { background: #fff; color: #2d6a9f; border: 1.5px solid #2d6a9f; }
    .btn-outline:hover { background: #ebf4ff; }

    /* ── 担当タブ ── */
    .tabs {
      display: flex; gap: 4px;
      padding: 0 28px;
      flex-wrap: wrap;
    }
    .tab {
      padding: 7px 18px;
      border-radius: 8px 8px 0 0;
      cursor: pointer;
      background: #e2e8f0;
      color: #4a5568;
      font-size: 13px;
      font-weight: 600;
      border: none;
      transition: background .15s, color .15s;
    }
    .tab.active { background: #2d6a9f; color: #fff; }
    .tab:hover:not(.active) { background: #cbd5e0; }

    /* ── テーブル ── */
    .table-wrap {
      margin: 0 28px 28px;
      background: #fff;
      border-radius: 0 10px 10px 10px;
      box-shadow: 0 1px 4px rgba(0,0,0,.08);
      overflow: auto;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }
    thead th {
      background: #1e3a5f;
      color: #fff;
      padding: 10px 12px;
      text-align: left;
      white-space: nowrap;
      position: sticky;
      top: 0;
      cursor: pointer;
      user-select: none;
    }
    thead th:hover { background: #2d6a9f; }
    thead th.chk-col { width: 36px; text-align: center; }

    tbody tr { border-bottom: 1px solid #edf2f7; transition: background .12s; }
    tbody tr:hover { background: #ebf8ff; }
    tbody tr.hidden { display: none; }
    tbody tr.checked-row { background: #f0fff4; }

    tbody td { padding: 9px 12px; vertical-align: middle; }
    tbody td.chk-col { text-align: center; }

    td.company-name { font-weight: 600; min-width: 180px; }
    td.url a { color: #2d6a9f; text-decoration: none; font-size: 11px; }
    td.url a:hover { text-decoration: underline; }
    td.reason { max-width: 280px; color: #4a5568; line-height: 1.4; }
    td.address { min-width: 130px; color: #4a5568; }

    /* ── バッジ ── */
    .badge {
      display: inline-block;
      padding: 2px 10px;
      border-radius: 99px;
      font-size: 11px;
      font-weight: 700;
      white-space: nowrap;
    }
    .badge-gold   { background: #fffbeb; color: #b7791f; border: 1px solid #f6d860; }
    .badge-silver { background: #f7fafc; color: #4a5568; border: 1px solid #cbd5e0; }
    .badge-bronze { background: #fff5f0; color: #c05621; border: 1px solid #fbd38d; }

    .status-badge {
      display: inline-block;
      padding: 2px 10px;
      border-radius: 99px;
      font-size: 11px;
      font-weight: 700;
      white-space: nowrap;
    }
    .status-sent    { background: #f0fff4; color: #276749; border: 1px solid #9ae6b4; }
    .status-unsent  { background: #fff8e1; color: #b7791f; border: 1px solid #f6d860; }
    .status-ng      { background: #fff5f5; color: #c53030; border: 1px solid #feb2b2; }

    .cat-badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 6px;
      font-size: 11px;
      background: #ebf4ff;
      color: #2b6cb0;
      white-space: nowrap;
    }

    /* ── 選択アクションバー ── */
    #action-bar {
      display: none;
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: #1e3a5f;
      color: #fff;
      padding: 12px 24px;
      border-radius: 99px;
      box-shadow: 0 4px 20px rgba(0,0,0,.3);
      align-items: center;
      gap: 16px;
      font-size: 14px;
      z-index: 9999;
      white-space: nowrap;
    }
    #action-bar.visible { display: flex; }

    /* ── レスポンシブ ── */
    @media (max-width: 768px) {
      header { padding: 14px 16px; }
      .stats, .filters, .tabs, .table-wrap { margin-left: 12px; margin-right: 12px; padding-left: 12px; padding-right: 12px; }
      .stats { padding: 14px 12px 0; }
      .tabs  { padding: 0 12px; }
    }
  </style>
</head>
<body>

<header>
  <div class="logo">⚽</div>
  <div>
    <h1>協賛メール送付リスト</h1>
    <p>港区中学生サッカー大会 スポンサー管理</p>
  </div>
</header>

<!-- 統計 -->
<div class="stats">
  <div class="stat-card total">
    <div class="num" id="cnt-total">0</div>
    <div class="lbl">総件数</div>
  </div>
  <div class="stat-card sent">
    <div class="num" id="cnt-sent">0</div>
    <div class="lbl">送信済み</div>
  </div>
  <div class="stat-card unsent">
    <div class="num" id="cnt-unsent">0</div>
    <div class="lbl">未アプローチ</div>
  </div>
  <div class="stat-card ng">
    <div class="num" id="cnt-ng">0</div>
    <div class="lbl">見込みなし</div>
  </div>
</div>

<!-- フィルター -->
<div class="filters">
  <input type="text" id="search" placeholder="🔍  企業名・住所で検索..." oninput="applyFilters()" />
  <select id="filter-status" onchange="applyFilters()">
    <option value="">すべてのステータス</option>
    <option value="送信済み">送信済み</option>
    <option value="未アプローチ">未アプローチ</option>
    <option value="見こみなし">見込みなし</option>
  </select>
  <select id="filter-cat" onchange="applyFilters()">
    <option value="">すべてのカテゴリ</option>
    <option value="飲料">飲料</option>
    <option value="フィットネス">フィットネス</option>
    <option value="スポーツ用品店">スポーツ用品店</option>
    <option value="整体系">整体系</option>
    <option value="学習塾">学習塾</option>
    <option value="SNS">SNS</option>
  </select>
  <select id="filter-plan" onchange="applyFilters()">
    <option value="">すべてのプラン</option>
    <option value="ゴールド">ゴールド</option>
    <option value="シルバー">シルバー</option>
    <option value="ブロンズ">ブロンズ</option>
  </select>
  <button class="btn btn-outline" onclick="clearFilters()">リセット</button>
  <button class="btn btn-primary" onclick="selectAll()">全選択</button>
  <button class="btn btn-outline" onclick="clearSelection()">選択解除</button>
</div>

<!-- 担当タブ -->
<div class="tabs">
  <button class="tab active" onclick="switchTab('all', this)">全員</button>
  <button class="tab" onclick="switchTab('ねね', this)">ねね</button>
  <button class="tab" onclick="switchTab('もか', this)">もか</button>
  <button class="tab" onclick="switchTab('岡本', this)">岡本</button>
  <button class="tab" onclick="switchTab('荒', this)">荒</button>
  <button class="tab" onclick="switchTab('朝', this)">朝</button>
</div>

<!-- テーブル -->
<div class="table-wrap">
  <table id="main-table">
    <thead>
      <tr>
        <th class="chk-col"><input type="checkbox" id="check-all" onchange="toggleAll(this)" /></th>
        <th onclick="sortTable(1)">No.</th>
        <th onclick="sortTable(2)">カテゴリ</th>
        <th onclick="sortTable(3)">企業名・店舗名</th>
        <th onclick="sortTable(4)">推奨プラン</th>
        <th onclick="sortTable(5)">住所</th>
        <th>URL</th>
        <th>アプローチ理由・ポイント</th>
        <th onclick="sortTable(8)">担当者名</th>
        <th>電話番号</th>
        <th>メールアドレス</th>
        <th onclick="sortTable(11)">ステータス</th>
        <th onclick="sortTable(12)">担当</th>
      </tr>
    </thead>
    <tbody id="tbody">
    </tbody>
  </table>
</div>

<!-- 選択アクションバー -->
<div id="action-bar">
  <span id="selected-count">0件選択中</span>
  <button class="btn btn-success" onclick="exportSelected()">📧 選択企業を書き出す</button>
  <button class="btn btn-outline" style="color:#fff;border-color:#fff" onclick="clearSelection()">✕ 解除</button>
</div>

/* ── 状態 ── */
let activeTab = 'all';
let sortCol = 1, sortAsc = true;
const selected = new Set();

/* ── プランバッジ ── */
function planBadge(plan) {
  if (plan.includes('ゴールド'))  return `<span class="badge badge-gold">🥇 ゴールド</span>`;
  if (plan.includes('シルバー')) return `<span class="badge badge-silver">🥈 シルバー</span>`;
  return                                `<span class="badge badge-bronze">🥉 ブロンズ</span>`;
}
function statusBadge(s) {
  if (s === '送信済み')  return `<span class="status-badge status-sent">✓ 送信済み</span>`;
  if (s === '見こみなし') return `<span class="status-badge status-ng">✗ 見込なし</span>`;
  return                        `<span class="status-badge status-unsent">◎ 未アプローチ</span>`;
}

/* ── テーブル描画 ── */
function render() {
  const tbody = document.getElementById('tbody');
  tbody.innerHTML = '';
  const q     = document.getElementById('search').value.trim().toLowerCase();
  const fStat = document.getElementById('filter-status').value;
  const fCat  = document.getElementById('filter-cat').value;
  const fPlan = document.getElementById('filter-plan').value;

  let rows = DATA.filter(d => {
    if (activeTab !== 'all' && d.owner !== activeTab) return false;
    if (fStat && d.status !== fStat) return false;
    if (fCat  && d.cat   !== fCat)  return false;
    if (fPlan && !d.plan.includes(fPlan)) return false;
    if (q && !d.name.toLowerCase().includes(q) && !d.addr.toLowerCase().includes(q)) return false;
    return true;
  });

  rows.sort((a,b)=>{
    const keys=['no','no','cat','name','plan','addr','url','reason','contact','tel','email','status','owner'];
    const k=keys[sortCol]||'no';
    const va = String(a[k]||''), vb = String(b[k]||'');
    return sortAsc ? va.localeCompare(vb,'ja') : vb.localeCompare(va,'ja');
  });

  rows.forEach(d => {
    const chk = selected.has(d.no);
    const tr = document.createElement('tr');
    if(chk) tr.classList.add('checked-row');
    tr.dataset.no = d.no;
    tr.innerHTML = `
      <td class="chk-col"><input type="checkbox" onchange="toggleRow(${d.no},this)" ${chk?'checked':''}></td>
      <td>${d.no}</td>
      <td><span class="cat-badge">${d.cat}</span></td>
      <td class="company-name">${d.name}</td>
      <td>${planBadge(d.plan)}</td>
      <td class="address">${d.addr||'—'}</td>
      <td class="url">${d.url?`<a href="${d.url}" target="_blank" rel="noopener">🔗 開く</a>`:'—'}</td>
      <td class="reason">${d.reason||'—'}</td>
      <td>${d.contact||'—'}</td>
      <td>${d.tel||'—'}</td>
      <td>${d.email||'—'}</td>
      <td>${statusBadge(d.status)}</td>
      <td>${d.owner||'—'}</td>`;
    tbody.appendChild(tr);
  });

  updateStats();
}

/* ── 統計更新 ── */
function updateStats() {
  document.getElementById('cnt-total').textContent  = DATA.length;
  document.getElementById('cnt-sent').textContent   = DATA.filter(d=>d.status==='送信済み').length;
  document.getElementById('cnt-unsent').textContent = DATA.filter(d=>d.status==='未アプローチ').length;
  document.getElementById('cnt-ng').textContent     = DATA.filter(d=>d.status==='見こみなし').length;
}

/* ── フィルター・タブ ── */
function applyFilters() { render(); }
function clearFilters() {
  document.getElementById('search').value='';
  document.getElementById('filter-status').value='';
  document.getElementById('filter-cat').value='';
  document.getElementById('filter-plan').value='';
  render();
}
function switchTab(tab, el) {
  activeTab = tab;
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  el.classList.add('active');
  render();
}

/* ── ソート ── */
function sortTable(col) {
  if (sortCol===col) sortAsc=!sortAsc; else { sortCol=col; sortAsc=true; }
  render();
}

/* ── 選択 ── */
function toggleRow(no, cb) {
  if(cb.checked) selected.add(no); else selected.delete(no);
  const tr = cb.closest('tr');
  tr.classList.toggle('checked-row', cb.checked);
  updateActionBar();
}
function toggleAll(master) {
  const cbs = document.querySelectorAll('#tbody input[type=checkbox]');
  cbs.forEach(cb=>{
    cb.checked = master.checked;
    const no = Number(cb.closest('tr').dataset.no);
    if(master.checked) selected.add(no); else selected.delete(no);
    cb.closest('tr').classList.toggle('checked-row', master.checked);
  });
  updateActionBar();
}
function selectAll() {
  DATA.forEach(d=>selected.add(d.no));
  render();
  updateActionBar();
}
function clearSelection() {
  selected.clear();
  document.querySelectorAll('#tbody input[type=checkbox]').forEach(cb=>cb.checked=false);
  document.querySelectorAll('#tbody tr').forEach(tr=>tr.classList.remove('checked-row'));
  document.getElementById('check-all').checked=false;
  updateActionBar();
}
function updateActionBar() {
  const bar = document.getElementById('action-bar');
  const cnt = selected.size;
  document.getElementById('selected-count').textContent = cnt+'件選択中';
  bar.classList.toggle('visible', cnt>0);
}

/* ── 書き出し ── */
function exportSelected() {
  const list = DATA.filter(d=>selected.has(d.no));
  const lines = list.map(d=>`No.${d.no}\t${d.cat}\t${d.name}\t${d.plan}\t${d.addr||''}\t${d.url||''}\t${d.status}\t${d.owner}`);
  const text = '番号\tカテゴリ\t企業名\tプラン\t住所\tURL\tステータス\t担当\n' + lines.join('\n');
  const blob = new Blob(['﻿'+text],{type:'text/tab-separated-values;charset=utf-8'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = '協賛送付リスト.tsv';
  a.click();
}

/* ── 初期化 ── */
render();
</script>
</body>
</html>
