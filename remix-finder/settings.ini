; リミックス楽曲ファインダーの設定ファイル
; 行の先頭の「;」はメモ（無視されます）。値を変えたらアプリを再起動してください。

[analysis]
; AudD に送る1クリップの長さ（秒）
clip_seconds = 12
; 動画の何秒ごとにクリップを切り出すか
interval_seconds = 20
; 1本の動画あたり AudD に送るリクエストの上限（キャッシュから返した分は数えません）
max_requests_per_video = 30
; 速度補正で試す倍率（動画が元の曲の何倍速になっているかの予想）。左から順に試します
; 1.25 = 1.25倍速の sped up 版、0.8 = 0.8倍速の slowed 版
speed_factors = 1.25, 0.8, 1.2, 0.85, 1.15, 0.9, 1.3, 0.75, 1.1
; 速度補正で、1つの倍率につき何か所試すか
speed_probe_clips = 2
; これより小さい音量（dB）のクリップは無音とみなして送らない
silence_threshold_db = -45
; Demucs のモデル名（htdemucs が標準。htdemucs_ft は4倍遅いが少し高精度）
demucs_model = htdemucs

[server]
; ブラウザで開くアドレスの番号（http://localhost:8765）
port = 8765
