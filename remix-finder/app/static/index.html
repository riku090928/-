<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>リミックス楽曲ファインダー</title>
<style>
  :root {
    --bg: #f6f6f8; --card: #fff; --text: #1d1d22; --muted: #6b6b76; --line: #e2e2e8;
    --accent: #5b4bdb; --accent-soft: #eeebff; --warn: #a15c00; --warn-soft: #fff4e0;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #141418; --card: #1e1e24; --text: #ececf1; --muted: #9a9aa6; --line: #33333d;
      --accent: #9d92ff; --accent-soft: #2a2645; --warn: #ffb347; --warn-soft: #3a2c14;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font-family: "Segoe UI", "Hiragino Sans", "Yu Gothic UI", "Meiryo", sans-serif; line-height: 1.6; }
  main { max-width: 760px; margin: 0 auto; padding: 32px 16px 64px; }
  h1 { font-size: 1.5rem; margin: 0 0 4px; }
  .sub { color: var(--muted); margin: 0 0 24px; font-size: .95rem; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 20px; margin-bottom: 16px; }
  .drop { display: block; border: 2px dashed var(--line); border-radius: 12px; padding: 32px 16px; text-align: center; cursor: pointer; transition: .15s; }
  .drop.over, .drop:hover { border-color: var(--accent); background: var(--accent-soft); }
  .drop input { display: none; }
  .drop strong { display: block; font-size: 1.05rem; }
  .drop span { color: var(--muted); font-size: .9rem; }
  button { background: var(--accent); color: #fff; border: 0; border-radius: 8px; padding: 10px 20px; font-size: 1rem; cursor: pointer; margin-top: 16px; }
  button:disabled { opacity: .5; cursor: default; }
  .badge { display: inline-block; font-size: .8rem; padding: 2px 8px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); }
  .badge.warn { background: var(--warn-soft); color: var(--warn); }
  .status { display: flex; align-items: center; gap: 12px; }
  .spinner { width: 20px; height: 20px; border: 3px solid var(--line); border-top-color: var(--accent); border-radius: 50%; animation: spin 1s linear infinite; flex: none; }
  @keyframes spin { to { transform: rotate(360deg); } }
  h2 { font-size: 1.1rem; margin: 0 0 12px; }
  .song { border-top: 1px solid var(--line); padding: 12px 0; }
  .song:first-of-type { border-top: 0; padding-top: 0; }
  .title { font-weight: 700; font-size: 1.1rem; }
  .artist { color: var(--muted); }
  .links { display: flex; gap: 8px; flex-wrap: wrap; margin: 8px 0; }
  .links a { text-decoration: none; font-size: .9rem; padding: 4px 12px; border-radius: 6px; border: 1px solid var(--line); color: var(--text); }
  .links a:hover { border-color: var(--accent); color: var(--accent); }
  .found { font-size: .85rem; color: var(--muted); }
  .none { color: var(--muted); }
  .note { font-size: .85rem; color: var(--warn); margin: 4px 0; }
  table { width: 100%; border-collapse: collapse; font-size: .85rem; }
  th, td { text-align: left; padding: 6px 4px; border-bottom: 1px solid var(--line); }
  th { color: var(--muted); font-weight: 600; }
  details summary { cursor: pointer; color: var(--muted); }
  .usage { font-size: .9rem; color: var(--muted); }
  .hidden { display: none; }
</style>
</head>
<body>
<main>
  <h1>リミックス楽曲ファインダー</h1>
  <p class="sub">リミックス動画から「原曲（ボーカル）」と「ビートの元ネタ」を探します。 <span id="mode"></span></p>

  <div class="card">
    <label class="drop" id="drop">
      <input type="file" id="file" accept="video/*,audio/*">
      <strong id="dropText">ここをクリックして動画を選ぶ</strong>
      <span>または動画ファイルをここにドラッグ（mp4 など）</span>
    </label>
    <button id="go" disabled>解析する</button>
  </div>

  <div class="card hidden" id="statusCard">
    <div class="status"><div class="spinner" id="spinner"></div><div id="statusText"></div></div>
  </div>

  <div id="results" class="hidden">
    <div class="card"><h2>🎤 原曲（ボーカル）</h2><div id="vocal"></div></div>
    <div class="card"><h2>🥁 ビート（伴奏の元ネタ）</h2><div id="beat"></div></div>
    <div class="card">
      <p class="usage" id="usage"></p>
      <div id="notes"></div>
      <details><summary>見つかった場所の一覧</summary><div id="timeline"></div></details>
    </div>
  </div>
</main>

<script>
const $ = (id) => document.getElementById(id);
const fileInput = $("file"), drop = $("drop"), go = $("go");
let chosen = null;

const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const speedText = (sp) => sp === 1 ? "" : `・${sp}倍速を元に戻して検出`;

fetch("/api/info").then(r => r.json()).then(info => {
  $("mode").innerHTML = info.mode === "dummy"
    ? '<span class="badge warn">ダミーモード：AudD を呼ばずに試し用の結果を表示します</span>'
    : `<span class="badge">本番モード：1本あたり最大 ${info.max_requests_per_video} 回 ／ これまでの累計 ${info.total_requests} 回</span>`;
});

function choose(f) {
  if (!f) return;
  chosen = f;
  $("dropText").textContent = `選択中：${f.name}`;
  go.disabled = false;
}
fileInput.addEventListener("change", () => choose(fileInput.files[0]));
["dragenter", "dragover"].forEach(e => drop.addEventListener(e, (ev) => { ev.preventDefault(); drop.classList.add("over"); }));
["dragleave", "drop"].forEach(e => drop.addEventListener(e, (ev) => { ev.preventDefault(); drop.classList.remove("over"); }));
drop.addEventListener("drop", (ev) => choose(ev.dataTransfer.files[0]));

function setStatus(text, busy) {
  $("statusCard").classList.remove("hidden");
  $("statusText").textContent = text;
  $("spinner").classList.toggle("hidden", !busy);
}

go.addEventListener("click", async () => {
  if (!chosen) return;
  go.disabled = true;
  $("results").classList.add("hidden");
  setStatus("アップロードしています…", true);
  const fd = new FormData();
  fd.append("file", chosen);
  try {
    const r = await fetch("/api/analyze", { method: "POST", body: fd });
    const data = await r.json();
    if (!r.ok) throw new Error(data.detail || "アップロードに失敗しました");
    setStatus(`「${data.filename}」を受け取りました。解析を始めます…`, true);
    poll(data.job_id);
  } catch (e) {
    setStatus(e.message, false);
    go.disabled = false;
  }
});

async function poll(id) {
  const r = await fetch(`/api/jobs/${id}`);
  const job = await r.json();
  if (job.status === "done") { setStatus(job.message, false); show(job.result); go.disabled = false; return; }
  if (job.status === "error") { setStatus(job.message, false); go.disabled = false; return; }
  setStatus(job.message, true);
  setTimeout(() => poll(id), 1000);
}

function songHtml(s) {
  const links = [
    s.apple_music && `<a href="${esc(s.apple_music)}" target="_blank" rel="noopener">Apple Music で開く</a>`,
    s.spotify && `<a href="${esc(s.spotify)}" target="_blank" rel="noopener">Spotify で開く</a>`,
    (!s.apple_music && !s.spotify && s.song_link) && `<a href="${esc(s.song_link)}" target="_blank" rel="noopener">配信リンク</a>`,
  ].filter(Boolean).join("");
  const found = s.found.map(f => `${f.time}（${f.method}・${f.source}${speedText(f.speed)}）`).join("、");
  return `<div class="song">
    <div class="title">${esc(s.title)}${s.confident ? "" : ' <span class="badge warn">候補（1か所だけで検出・誤判定の可能性あり）</span>'}</div>
    <div class="artist">${esc(s.artist)}${s.album ? " ／ " + esc(s.album) : ""}</div>
    <div class="links">${links || '<span class="none">リンクは見つかりませんでした</span>'}</div>
    <div class="found">見つかった位置：${esc(found)}</div>
  </div>`;
}

function roleHtml(list, fallback) {
  if (!list.length) return '<p class="none">特定できませんでした</p>';
  const note = fallback ? '<p class="note">※ 分離した音声では見つからなかったため、元の音声での検出結果を表示しています。</p>' : "";
  return note + list.map(songHtml).join("");
}

function show(res) {
  $("results").classList.remove("hidden");
  $("vocal").innerHTML = roleHtml(res.vocal, res.vocal_fallback);
  $("beat").innerHTML = roleHtml(res.beat, res.beat_fallback);
  $("usage").textContent = res.mode === "dummy"
    ? `ダミーモード：仮のリクエスト ${res.requests_used} 回（上限 ${res.budget} 回・実際の AudD は呼んでいません）`
    : `今回使ったリクエスト数：${res.requests_used} 回（上限 ${res.budget} 回、キャッシュから ${res.cache_hits} 件）／ これまでの累計 ${res.total_requests} 回`;
  $("notes").innerHTML = res.notes.map(n => `<p class="note">${esc(n)}</p>`).join("");
  $("timeline").innerHTML = res.timeline.length
    ? `<table><tr><th>位置</th><th>方法</th><th>音声</th><th>曲</th></tr>${res.timeline.map(t =>
        `<tr><td>${t.time}</td><td>${esc(t.method)}${t.speed !== 1 ? ` ×${t.speed}` : ""}</td><td>${esc(t.source)}</td><td>${esc(t.artist)} – ${esc(t.title)}</td></tr>`).join("")}</table>`
    : '<p class="none">見つかった曲はありません。</p>';
}
</script>
</body>
</html>
